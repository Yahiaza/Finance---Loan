name: Build Portable Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Portable
        run: npm run build:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Central Server
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $staging = Join-Path $env:RUNNER_TEMP "Finance-Central-Server"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Path "server\*" -Destination $staging -Recurse -Force
          Copy-Item -LiteralPath "server\.env.example" -Destination $staging -Force
          Compress-Archive -Path "$staging\*" -DestinationPath "release\Finance-Central-Server-$tag.zip" -CompressionLevel Optimal
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $portable = Get-ChildItem -Path release -Filter "Financial-Reports-Portable-*.exe" | Select-Object -ExpandProperty FullName
          $server = Get-ChildItem -Path release -Filter "Finance-Central-Server-*.zip" | Select-Object -ExpandProperty FullName
          if (-not $portable) { throw "Portable EXE was not generated." }
          if (-not $server) { throw "Central server package was not generated." }
          $files = @($portable) + @($server)
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $files --title $tag --generate-notes
          } else {
            gh release upload $tag $files --clobber
          }

name: Build Portable Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Portable 64-bit
        run: npm run build:portable:x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Portable 32-bit
        run: npm run build:portable:ia32
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test data protection
        run: node --test electron/purchase-scope.test.cjs electron/access-purchase.test.cjs src/features/suppliers/transferDepartments.test.mjs
      - name: Build Purchase Orders 64-bit
        run: npm run build:purchase:x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Purchase Orders 32-bit
        run: npm run build:purchase:ia32
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Central Server
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $staging = Join-Path $env:RUNNER_TEMP "Finance-Central-Server"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Path "server\*" -Destination $staging -Recurse -Force
          Copy-Item -LiteralPath "server\.env.example" -Destination $staging -Force
          Compress-Archive -Path "$staging\*" -DestinationPath "release\Finance-Central-Server-$tag.zip" -CompressionLevel Optimal
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $portable64 = Get-ChildItem -Path release -Filter "Financial-Reports-Portable-*-x64.exe" | Select-Object -First 1 -ExpandProperty FullName
          $portable32 = Get-ChildItem -Path release -Filter "Financial-Reports-Portable-*-ia32.exe" | Select-Object -First 1 -ExpandProperty FullName
          $server = Get-ChildItem -Path release -Filter "Finance-Central-Server-*.zip" | Select-Object -ExpandProperty FullName
          if (-not $portable64) { throw "64-bit Portable EXE was not generated." }
          if (-not $portable32) { throw "32-bit Portable EXE was not generated." }
          if (-not $server) { throw "Central server package was not generated." }
          $purchase64 = Get-ChildItem -Path release -Filter "Purchase-Orders-Portable-*-x64.exe" | Select-Object -First 1 -ExpandProperty FullName
          $purchase32 = Get-ChildItem -Path release -Filter "Purchase-Orders-Portable-*-ia32.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $purchase64 -or -not $purchase32) { throw "Purchase Orders editions were not generated." }
          $files = @($portable64, $portable32, $purchase64, $purchase32) + @($server)
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $files --title $tag --generate-notes
          } else {
            gh release upload $tag $files --clobber
          }

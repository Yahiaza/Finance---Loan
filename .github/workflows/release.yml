name: Build Portable Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Portable
        run: npm run build:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem -Path release -Filter "Financial-Reports-Portable-*.exe" | Select-Object -ExpandProperty FullName
          if (-not $files) { throw "Portable EXE was not generated." }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $files --title $tag --generate-notes
          } else {
            gh release upload $tag $files --clobber
          }
